#
# # --------------------------------------------------------------
# # Variables
# # --------------------------------------------------------------
# variables:
#   CUSTOMER: inuits
#   PROJECT: dams
#   APPLICATION: collection
#
#   SKIP_DEPLOY: 'true'
#
#   HARBOR_PROJECT_DEV: elody-dams-dev
#   TARGET_CLUSTER_DEV: inuits-prod
#
#
# # --------------------------------------------------------------
# # Template overrides
# # --------------------------------------------------------------
#

---
stages:
  - build
  - deliver

variables:
  IMAGE_NAME: dams-collection
  HARBOR_PROJECT_PREFIX: elody-dams-dev
  BUILD_REGISTRY: ${HARBOR_URL}/build/${HARBOR_PROJECT_PREFIX}
  DESTINATION_REGISTRY: ${HARBOR_URL}/${HARBOR_PROJECT_PREFIX}/inuits

  PYPI_HOST: nexus.inuits.eu
  PYPI_PATH: /repository/python/simple
  PIP_INDEX_URL: "https://${PYPI_USERNAME}:${PYPI_PASSWORD}@${PYPI_HOST}${PYPI_PATH}"
  PIP_TRUSTED_HOST: "${PYPI_HOST}"

include:
  - component: $CI_SERVER_FQDN/components/containers/build@v0.10.3
    inputs:
      image_name: ${IMAGE_NAME}
      destination_registry: ${BUILD_REGISTRY}
      build_secrets:
        - id=PIP_INDEX_URL,env=PIP_INDEX_URL
        - id=PIP_TRUSTED_HOST,env=PIP_TRUSTED_HOST

  - component: $CI_SERVER_FQDN/components/containers/deliver@v0.10.3
    inputs:
      image_name: ${IMAGE_NAME}
      source_registry: ${BUILD_REGISTRY}
      destination_registries:
        - ${DESTINATION_REGISTRY}
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Only run pipeline for default branch, otherwise require manual approval
build:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: always
    - if: "$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH"
      when: manual
